[project]
name = "reel-report"
version = "0.1.0"
description = "Turns TRIBE v2 predictions into a per-second brain-response report"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "nilearn>=0.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.20"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
